name: Refresh market data & rebuild site

# ============================================================================
# SCHEDULE DISABLED 2026-08-11 — MANUAL-DISPATCH ONLY.
#
# The CANONICAL daily refresh is the Windows Task Scheduler on Carlos's host
# (see AI_PROCEDURES/DAILY_REFRESH_PIPELINE.md). This workflow was a duplicate
# cloud backup publisher. It had been failing EVERY weekday since 2026-07-17
# (last green: run 43, 2026-07-16) and emailing a failure notice each time.
#
# Why the cron is gone rather than "fixed":
#   1. Redundant — the host already refreshes and pushes daily; GitHub Pages
#      (pages-build-deployment) deploys off that push, so the public site is
#      unaffected by this workflow being idle.
#   2. Unfixable as written — 25_stock_picks.py -> picker.py reads the PRIVATE
#      host analytics at ~/capstone/data/analytics/stock_sensitivities.parquet,
#      which cannot exist on a runner and MUST NOT be committed to this public
#      repo (see GH_ACTIONS_CI_PLAYBOOK.md § RESTRAINT CHECK).
#   3. Actively hazardous — this job does `git add -A` + commit + push to main.
#      A cloud push racing the host scheduler is the documented "refresh
#      rebase-trap" that froze the live site for six days in June 2026.
#
# workflow_dispatch is retained so the build can still be run by hand if the
# host is ever down for an extended period. Full rationale + revival steps:
#   AI_PROCEDURES/GITHUB_ACTIONS_REFRESH.md
# ============================================================================

on:
  workflow_dispatch:            # MANUAL ONLY — schedule intentionally removed

permissions:
  contents: write

# never let two refreshes overlap (a hung run + the next cron, or a manual re-run)
concurrency:
  group: refresh-site
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15        # backstop: a daily refresh must never run for hours
    env:
      # api.stlouisfed.org works from Actions runners (the keyless fredgraph.csv
      # scrape never did — it throttles cloud IPs into 60s-timeout chains).
      # scripts/fred_api.py reads this; without it, the keyless fallback +
      # FRED_DEADLINE skip-and-use-prior behavior still applies.
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # the pipeline scripts expect the project at ~/LTCMA
      - name: Link workspace to ~/LTCMA
        run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/LTCMA"

      - name: Refresh signals (FRED, GPR, EPU, VIX)
        run: python scripts/08_fetch_signals.py

      - name: Refresh regimes + stock analysis
        run: |
          python scripts/10_regimes.py            # regime series (feeds regime.html + dashboard)
          python scripts/20_regime_tracker.py     # regime.html
          python scripts/19_stock_analysis.py     # stock_*.html + stocks.html data

      - name: Rebuild public site
        # Full public build so a host-off day advances EVERY public page to the same
        # date, not just the dashboard. Excludes the three host-only scripts on purpose:
        #   18_portfolio / 26_real_numbers -> read the private book (Downloads/Documents),
        #                                      absent on the runner; portfolio.html lags a
        #                                      host-off day by design.
        #   24_backtests -> static redirect stub into strategies.html#backtests.
        # 23_strategies reads the Trading_Index hub on the host but falls back to the
        # committed catalog + docs/index.html's window.BT_DATA in CI (see glossary.bt_load /
        # bt_catalog), so it must run AFTER 17 rebuilds index.html.
        #
        # 25_stock_picks REMOVED 2026-08-11 — it is host-only, not CI-safe. It imports
        # picker.build_universe(), which does an UNGUARDED
        #   pd.read_parquet("~/capstone/data/analytics/stock_sensitivities.parquet")
        # at picker.py:155. That path is private host analytics, absent on every runner,
        # so the step died with FileNotFoundError in ~5s on every run from 2026-08-05
        # (run 57) onward. Committing that parquet to green the build would publish
        # private state -- forbidden, see GH_ACTIONS_CI_PLAYBOOK.md § RESTRAINT CHECK.
        # stocks.html therefore lags a host-off day, exactly as portfolio.html does.
        # To restore it here, picker.py must first gain a graceful fallback for a
        # missing ANA parquet (and pyarrow must be added to requirements.txt).
        run: |
          python scripts/17_build_site.py         # index / report / glossary / projects
          python scripts/23_strategies.py         # strategies.html
          python scripts/27_research_notes.py     # research.html
          python scripts/21_stock_signals.py      # signals.html redirect

      - name: Commit refreshed data & site
        run: |
          git config user.name  "ltcma-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && { echo "no changes to commit"; exit 0; }
          git commit -m "Auto-refresh: market data & site ($(date -u +%Y-%m-%d))"
          # host scheduler may have pushed during the run — rebase before pushing
          git pull --rebase --autostash origin main || true
          git push
