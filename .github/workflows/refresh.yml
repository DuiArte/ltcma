name: Refresh market data & rebuild site

on:
  schedule:
    - cron: '0 22 * * 1-5'     # weekdays 22:00 UTC (post US/BMV close); matches host scheduler
  workflow_dispatch:            # allow manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # the pipeline scripts expect the project at ~/LTCMA
      - name: Link workspace to ~/LTCMA
        run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/LTCMA"

      - name: Refresh signals (FRED, GPR, EPU, VIX)
        run: python scripts/08_fetch_signals.py

      - name: Rebuild site
        run: python scripts/17_build_site.py

      - name: Commit refreshed data & site
        run: |
          git config user.name  "ltcma-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-refresh: market data & site ($(date -u +%Y-%m-%d))"
          git push
